name: MS Discovery Pinterest Wakeup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ms-discovery-pinterest-kick.yml'
  schedule:
    # 5.7.11: Nur noch ein leiser externer Sicherheitscheck pro Stunde.
    # WordPress taktet Pinterest selbst; GitHub ist lediglich das Ausfallsicherungsnetz.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-discovery-pinterest-wakeup
  cancel-in-progress: true

jobs:
  wake-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Best-effort Pinterest wakeup
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          job_url = (os.environ.get('MSD_WORKER_URL') or '').strip()
          secret = (os.environ.get('MSD_WORKER_SECRET') or '').strip()
          if not job_url or not secret:
              print('Pinterest-Wakeup uebersprungen: Worker-URL oder Secret fehlt.')
              raise SystemExit(0)

          url = job_url.replace('/youtube-job', '/pinterest-kick')
          req = urllib.request.Request(url, headers={
              'X-MSD-Worker-Secret': secret,
              'User-Agent': 'MS-Discovery-Pinterest-Wakeup/1.1',
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode('utf-8', errors='replace')
                  try:
                      data = json.loads(raw)
                      print(json.dumps(data, ensure_ascii=False))
                  except Exception:
                      print(raw[:1200])
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')[:800]
              print(f'Pinterest-Wakeup HTTP {e.code}: {body} – kein Workflow-Fehler; naechster Stundenlauf versucht erneut.')
          except Exception as e:
              print(f'Pinterest-Wakeup derzeit nicht erreichbar: {e!r} – kein Workflow-Fehler; naechster Stundenlauf versucht erneut.')
          PY
