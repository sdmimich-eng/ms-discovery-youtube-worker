name: MS Discovery Pinterest Wakeup

on:
  schedule:
    # Externe Ausfallsicherung fuer WP-Cron: vier sehr kleine Checks pro Stunde.
    # Der Server macht nur dann echte Pinterest-Arbeit, wenn ein Lauf wirklich faellig ist.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-discovery-pinterest-wakeup
  cancel-in-progress: true

jobs:
  wake-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Pinterest automation if due
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          job_url = (os.environ.get('MSD_WORKER_URL') or '').strip()
          secret = (os.environ.get('MSD_WORKER_SECRET') or '').strip()
          if not job_url or not secret:
              raise SystemExit('MSD_WORKER_URL/MSD_WORKER_SECRET fehlen.')

          url = job_url.replace('/youtube-job', '/pinterest-kick')
          req = urllib.request.Request(url, headers={
              'X-MSD-Worker-Secret': secret,
              'User-Agent': 'MS-Discovery-Pinterest-Wakeup/1.0',
          })
          with urllib.request.urlopen(req, timeout=40) as r:
              data = json.loads(r.read().decode('utf-8'))
          print(json.dumps(data, ensure_ascii=False))
          PY
