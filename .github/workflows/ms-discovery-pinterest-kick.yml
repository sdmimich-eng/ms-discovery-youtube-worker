name: MS Discovery Pinterest + Media Wakeup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ms-discovery-pinterest-kick.yml'
  schedule:
    # Dieser Scheduler laeuft nachweislich zuverlaessig. Neben Pinterest prueft er
    # deshalb auch einen faelligen Media-Job. Discovery selbst begrenzt weiterhin
    # die Tagesmenge; hier wird pro Lauf hoechstens ein Job geholt.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-discovery-reliable-wakeup
  cancel-in-progress: false

jobs:
  wake-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Best-effort Pinterest wakeup
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          job_url = (os.environ.get('MSD_WORKER_URL') or '').strip()
          secret = (os.environ.get('MSD_WORKER_SECRET') or '').strip()
          if not job_url or not secret:
              print('Pinterest-Wakeup uebersprungen: Worker-URL oder Secret fehlt.')
              raise SystemExit(0)
          url = job_url.replace('/youtube-job', '/pinterest-kick')
          req = urllib.request.Request(url, headers={'X-MSD-Worker-Secret': secret, 'User-Agent': 'MS-Discovery-Pinterest-Wakeup/1.2'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(r.read().decode('utf-8', errors='replace')[:1200])
          except Exception as e:
              print('Pinterest-Wakeup derzeit nicht erreichbar:', repr(e))
          PY

  media-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker source
        run: python3 -m compileall -q worker
      - name: Claim exactly one due media job
        id: claim
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python3 worker/claim_job.py
      - uses: actions/setup-python@v5
        if: steps.claim.outputs.has_work == 'true'
        with:
          python-version: '3.12'
      - name: Install free renderer
        if: steps.claim.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r worker/requirements.txt
      - name: Cache free German neural voice
        if: steps.claim.outputs.is_youtube == 'true'
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: worker/voices
          key: piper-de-DE-thorsten-medium-v1
      - name: Download free German neural voice
        if: steps.claim.outputs.is_youtube == 'true' && steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p worker/voices
          python -m piper.download_voices de_DE-thorsten-medium --data-dir worker/voices
      - name: Render and upload YouTube video
        if: steps.claim.outputs.is_youtube == 'true'
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python worker/run_v12_claimed.py
      - name: Render social media item
        if: steps.claim.outputs.is_social == 'true'
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python worker/social_media_worker_v3.py
