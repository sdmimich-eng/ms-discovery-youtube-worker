name: MS Discovery Media Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/ms-discovery-youtube.yml'
  schedule:
    # Weiter vier Checks pro Stunde, aber bewusst versetzt zum WP-Hauptslot (:05)
    # und zum Pinterest-Wakeup (:17), damit die Systeme nicht gleichzeitig anlaufen.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-discovery-media-worker
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate worker source before claiming a job
        run: python3 -m compileall -q worker

      - name: Claim exactly one Discovery media job
        id: claim
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python3 worker/claim_job.py

      - name: Randomize optional publication timing
        if: steps.claim.outputs.has_work == 'true' && steps.claim.outputs.urgent != 'true'
        run: |
          DELAY=$(python3 - <<'PY'
          import secrets
          print(secrets.randbelow(241) + 20)
          PY
          )
          echo "Optionaler Media-Job: zufaellige Verzoegerung ${DELAY}s"
          sleep "$DELAY"

      - name: Urgent job starts immediately
        if: steps.claim.outputs.has_work == 'true' && steps.claim.outputs.urgent == 'true'
        run: echo "Dringender Media-Job – ohne kuenstliche Verzoegerung starten."

      - uses: actions/setup-python@v5
        if: steps.claim.outputs.has_work == 'true'
        with:
          python-version: '3.12'

      - name: Install free renderer
        if: steps.claim.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r worker/requirements.txt

      - name: Cache free German neural voice
        if: steps.claim.outputs.is_youtube == 'true'
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: worker/voices
          key: piper-de-DE-thorsten-medium-v1

      - name: Download free German neural voice
        if: steps.claim.outputs.is_youtube == 'true' && steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p worker/voices
          python -m piper.download_voices de_DE-thorsten-medium --data-dir worker/voices

      - name: Render V13 quality video and upload to YouTube
        if: steps.claim.outputs.is_youtube == 'true'
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python worker/run_v12_claimed.py

      - name: Render Instagram Story or Reel and publish through Buffer
        if: steps.claim.outputs.is_social == 'true'
        env:
          MSD_WORKER_URL: ${{ secrets.MSD_WORKER_URL }}
          MSD_WORKER_SECRET: ${{ secrets.MSD_WORKER_SECRET }}
          MSD_CLAIM_FILE: worker/claimed_job.json
        run: python worker/social_media_worker_v3.py
